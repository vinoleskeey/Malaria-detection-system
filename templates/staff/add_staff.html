{% extends "base.html" %}
{% block header %}Add New Staff Member{% endblock %}
{% block content %}

<div class="form-container">
    <h2 style="text-align: center; color: #00796b; margin-bottom: 30px;">
        <i class="fas fa-user-plus"></i> Add New Staff Member
    </h2>

    <form method="POST">
        <div class="form-group">
            <label><i class="fas fa-user"></i> Full Name</label>
            <input type="text" name="name" required placeholder="Enter staff full name" style="background: #f8f9fa;">
        </div>

        <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email</label>
            <input type="email" name="email" required placeholder="Enter email address" style="background: #f8f9fa;">
        </div>

        <div class="form-group">
            <label><i class="fas fa-phone"></i> Phone</label>
            <input type="text" name="phone" required placeholder="Enter phone number" style="background: #f8f9fa;">
        </div>

        <div class="form-group">
            <label><i class="fas fa-user-tag"></i> Role</label>
            <select name="role" required style="background: #f8f9fa;">
                <option value="">Select Role</option>
                <option value="Doctor">Doctor</option>
                <option value="Nurse">Nurse</option>
                <option value="Lab Technician">Lab Technician</option>
                <option value="Admin">Admin</option>
                <option value="Receptionist">Receptionist</option>
                <option value="Pharmacist">Pharmacist</option>
            </select>
        </div>

        <div class="form-group">
            <label><i class="fas fa-building"></i> Department</label>
            <select name="department" required style="background: #f8f9fa;">
                <option value="">Select Department</option>
                <option value="Doctors">Doctors</option>
                <option value="Nursing">Nursing</option>
                <option value="Laboratory">Laboratory</option>
                <option value="Pharmacy">Pharmacy</option>
                <option value="Administration">Administration</option>
                <option value="Reception">Reception</option>
            </select>
        </div>

        <div style="display: flex; gap: 15px; margin-top: 25px;">
            <button type="submit" class="btn btn-primary" style="flex: 1; padding: 15px;">
                <i class="fas fa-plus-circle"></i> Add Staff Member
            </button>
            <a href="/staff" class="btn" style="flex: 1; padding: 15px; background: #546e7a; color: white; text-align: center; text-decoration: none; border-radius: 10px;">
                <i class="fas fa-times"></i> Cancel
            </a>
        </div>
    </form>
</div>

{% endblock %}
