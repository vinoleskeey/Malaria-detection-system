{% extends "base.html" %}
{% block header %}Add New User{% endblock %}
{% block content %}

<div class="form-container">
    <h2><i class="fas fa-user-plus"></i> Add New User</h2>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-{% if 'error' in messages[0] %}error{% else %}success{% endif %}">
            {% for message in messages %}
                {{ message }}
            {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    
    <form method="post">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" required>
        </div>
        
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required minlength="6">
        </div>
        
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" required>
        </div>
        
        <div class="form-group">
            <label>Role</label>
            <select name="role" required>
                <option value="staff">Staff</option>
                <option value="admin">Admin</option>
                <option value="patient">Patient</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Department (for staff)</label>
            <input type="text" name="department" placeholder="e.g., Laboratory">
        </div>
        
        <div class="form-group">
            <label>Position (for staff)</label>
            <input type="text" name="position" placeholder="e.g., Lab Technician">
        </div>
        
        <div class="form-group">
            <label>Employee ID (for staff)</label>
            <input type="text" name="employee_id" placeholder="e.g., EMP001">
        </div>
        
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-plus"></i> Add User
        </button>
    </form>
</div>

{% endblock %}
