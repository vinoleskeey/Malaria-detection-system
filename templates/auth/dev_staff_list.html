{% extends "base.html" %}
{% block header %}Staff Members{% endblock %}
{% block content %}

<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
    <h3 style="color: white; margin: 0;"><i class="fas fa-user-md"></i> All Staff Members</h3>
    <div>
        <a href="/dev/create-staff" class="btn btn-primary">
            <i class="fas fa-user-plus"></i> Add New Staff
        </a>
    </div>
</div>

<table>
    <tr>
        <th><i class="fas fa-id-card"></i> ID</th>
        <th><i class="fas fa-user"></i> Name</th>
        <th><i class="fas fa-envelope"></i> Email</th>
        <th><i class="fas fa-user-tag"></i> Role</th>
        <th><i class="fas fa-cogs"></i> Actions</th>
    </tr>
    {% for staff in staff_members %}
    <tr>
        <td>{{ staff[0] }}</td>
        <td><i class="fas fa-user-circle" style="color: #00796b;"></i> {{ staff[1] }}</td>
        <td>{{ staff[2] }}</td>
        <td>{{ staff[3] }}</td>
        <td>
            <a href="/dev/staff/{{ staff[0] }}/delete" class="badge badge-danger" style="text-decoration: none;" onclick="return confirm('Are you sure you want to delete this staff member?');">
                <i class="fas fa-trash"></i> Delete
            </a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
