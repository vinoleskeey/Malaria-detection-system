{% extends "base.html" %}
{% block content %}

<div class="login-container">
    <div class="login-card">
        <h2><a href="/admin/login" tabindex="-1" class="heading-icon-link"><i class="fas fa-virus" style="color: #00796b;"></i></a> Login</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">
                  <i class="fas fa-exclamation-circle"></i>
                  {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="post" id="loginForm">
            <input name="email" placeholder="Email Address" required value="{{ request.form.get('email', '') }}" style="background: #f8f9fa;">
            <div class="password-field">
                <input name="password" type="password" id="password" placeholder="Password" required style="background: #f8f9fa;">
                <span class="toggle-password" onclick="togglePassword('password', 'toggleIcon')">
                    <svg id="toggleIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </span>
            </div>
            <button type="submit"><i class="fas fa-sign-in-alt"></i> Login</button>
        </form>

        <p>
            <a href="/forgot_password"><i class="fas fa-key"></i> Forgot Password?</a>
        </p>

        <p>
            Don't have an account? <a href="/register"><i class="fas fa-user-plus"></i> Register</a>
        </p>

    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === "password") {
        input.type = "text";
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    } else {
        input.type = "password";
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    }
}
</script>

<style>
/* base.html defines .alert-success / .alert-error globally, but not
   .alert-info - needed here because forgot_password() flashes category
   "info" for its security-conscious "if this email exists..." message. */
.alert-info { background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%); color: #0c5460; border-left: 4px solid #17a2b8; }

.password-field {
    position: relative;
    display: flex;
    align-items: center;
}
.password-field input {
    flex: 1;
    padding-right: 40px;
    background: #f8f9fa !important;
}
.toggle-password {
    position: absolute;
    right: 12px;
    cursor: pointer;
    color: #00796b;
    z-index: 10;
}
.toggle-password:hover {
    color: #004d40;
}

/* Developer-only shortcut: the heading virus icon links to staff/admin login.
   Renders identically to a plain icon - no underline, no pointer cursor,
   no color/size change - so it gives no hint of being clickable. */
.heading-icon-link,
.heading-icon-link:hover,
.heading-icon-link:focus {
    color: inherit;
    font: inherit;
    text-decoration: none;
    cursor: default;
    outline: none;
}
</style>

{% endblock %}
