{% extends "base.html" %}
{% block header %}New Malaria Prediction{% endblock %}
{% block content %}

<div class="form-container" style="max-width: 600px;">
    <h2 style="text-align: center; color: #00796b; margin-bottom: 30px;">
        <i class="fas fa-microscope"></i> Malaria Prediction
    </h2>

    <form method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label><i class="fas fa-user"></i> Select Patient</label>
            <select name="patient_id" required style="background: #f8f9fa;">
                <option value="">--Select Patient--</option>
                {% for patient in patients %}
                <option value="{{ patient.id }}">{{ patient.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label><i class="fas fa-image"></i> Upload Cell Image</label>
            <input type="file" name="file" accept=".jpg,.jpeg,.png" required style="background: #f8f9fa; padding: 12px; border: 2px dashed #00796b;">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 16px;">
            <i class="fas fa-play"></i> Run Prediction
        </button>
    </form>
</div>

<style>
    .form-container h2 {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
    }
    .form-group label {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    input[type="file"]::file-selector-button {
        background: linear-gradient(135deg, #00796b 0%, #004d40 100%);
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        margin-right: 15px;
    }
    input[type="file"]::file-selector-button:hover {
        background: linear-gradient(135deg, #004d40 0%, #00251a 100%);
    }
</style>

{% endblock %}
