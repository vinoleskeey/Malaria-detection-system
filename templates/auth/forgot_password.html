{% extends "base.html" %}
{% block header %}Reset Password{% endblock %}
{% block content %}

<div class="login-container">
    <div class="login-card">
        <h2><i class="fas fa-key"></i> Reset Password</h2>
        
        {% if error %}
        <div class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}
        
        {% if success %}
        <div class="alert alert-success">
            <i class="fas fa-check-circle"></i> {{ success }}
        </div>
        {% endif %}
        
        <form method="POST">
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; color: #37474f; font-weight: 500;">
                    <i class="fas fa-envelope"></i> Email Address
                </label>
                <input type="email" name="email" placeholder="Enter your registered email" required 
                       style="width: 100%; padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; transition: all 0.3s ease;">
            </div>
            
            <button type="submit" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #00796b 0%, #004d40 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease;">
                <i class="fas fa-paper-plane"></i> Send Reset Link
            </button>
        </form>
        
        <p style="text-align: center; margin-top: 20px; color: #546e7a;">
            <i class="fas fa-arrow-left"></i> Remember your password? 
            <a href="/login" style="color: #00796b; font-weight: 600; text-decoration: none;">Sign In</a>
        </p>
        
        <p style="text-align: center; margin-top: 15px; color: #546e7a;">
            Don't have an account? 
            <a href="/register" style="color: #00796b; font-weight: 600; text-decoration: none;">Register</a>
        </p>
    </div>
</div>

{% endblock %}
