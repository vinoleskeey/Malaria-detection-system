{% extends "base.html" %}
{% block content %}

<div class="login-container">
    <div class="login-card">
        <h2><i class="fas fa-user-plus" style="color: #00796b;"></i> Create Account</h2>

        <form method="post" id="registerForm">
            <input type="text" name="name" placeholder="Full Name" required style="background: #f8f9fa;">
            <input type="email" name="email" placeholder="Email Address" required style="background: #f8f9fa;">
            <div class="form-group">
                <select name="role" required style="background: #f8f9fa; width: 100%; padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; font-family: 'Poppins', sans-serif;">
                    <option value="patient">Patient</option>
                    <option value="staff">Hospital Staff</option>
                </select>
            </div>
            <div class="password-field">
                <input type="password" name="password" id="password" placeholder="Password" required minlength="6" style="background: #f8f9fa;">
                <span class="toggle-password" onclick="togglePassword('password', 'toggleIcon1')">
                    <svg id="toggleIcon1" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </span>
            </div>
            <div class="password-field">
                <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm Password" required style="background: #f8f9fa;">
                <span class="toggle-password" onclick="togglePassword('confirm_password', 'toggleIcon2')">
                    <svg id="toggleIcon2" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </span>
            </div>
            <div id="passwordError" class="error-message"></div>
            <button type="submit"><i class="fas fa-user-plus"></i> Create Account</button>
        </form>

        <p>
            Already have an account? <a href="/login"><i class="fas fa-sign-in-alt"></i> Sign In</a>
        </p>
    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === "password") {
        input.type = "text";
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    } else {
        input.type = "password";
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    }
}

document.getElementById('registerForm').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const errorDiv = document.getElementById('passwordError');
    
    if (password !== confirmPassword) {
        e.preventDefault();
        errorDiv.textContent = "Passwords do not match!";
        errorDiv.style.display = "block";
    } else {
        errorDiv.style.display = "none";
    }
});
</script>

<style>
.password-field {
    position: relative;
    display: flex;
    align-items: center;
}
.password-field input {
    flex: 1;
    padding-right: 40px;
    background: #f8f9fa !important;
}
.toggle-password {
    position: absolute;
    right: 12px;
    cursor: pointer;
    color: #00796b;
    z-index: 10;
}
.toggle-password:hover {
    color: #004d40;
}
.error-message {
    color: #dc3545;
    font-size: 14px;
    margin-bottom: 15px;
    display: none;
    padding: 10px;
    background: #f8d7da;
    border-radius: 8px;
}
</style>

{% endblock %}
