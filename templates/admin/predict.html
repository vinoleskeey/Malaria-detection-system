<!DOCTYPE html>
<html>
<head>
    <title>New Prediction - Admin Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #e8f4f8 0%, #d4e9f7 100%); min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%); padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: white; font-size: 22px; }
        .header a { color: white; text-decoration: none; padding: 10px 20px; background: rgba(255,255,255,0.2); border-radius: 8px; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .card h2 { color: #1a237e; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        .form-group select, .form-group input { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; font-family: 'Poppins', sans-serif; }
        .form-group select:focus, .form-group input:focus { outline: none; border-color: #1a237e; }
        .btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(26, 35, 126, 0.4); }
        .alert { padding: 16px; border-radius: 10px; margin-bottom: 20px; }
        .alert-error { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .alert-success { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-microscope"></i> New Malaria Prediction</h1>
        <a href="/admin/dashboard"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
    <div class="container">
        <div class="card">
            <h2><i class="fas fa-microscope"></i> Run Malaria Test</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}"><i class="fas fa-exclamation-circle"></i> {{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Select Patient</label>
                    <select name="patient_id" required>
                        <option value="">-- Select Patient --</option>
                        {% for p in patients %}
                        <option value="{{ p.id }}">{{ p.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-image"></i> Upload Cell Image</label>
                    <input type="file" name="file" accept=".png,.jpg,.jpeg" required>
                    <small style="color: #666; display: block; margin-top: 5px;">Upload a cell image for malaria parasite detection</small>
                </div>
                <button type="submit" class="btn"><i class="fas fa-search"></i> Run Prediction</button>
            </form>
        </div>
    </div>
</body>
</html>
