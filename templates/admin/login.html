<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Malaria Detection System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #01579b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { width: 100%; max-width: 420px; padding: 20px; }
        .login-card { background: #fff; padding: 45px; border-radius: 20px; box-shadow: 0 10px 50px rgba(0,0,0,0.3); position: relative; overflow: hidden; }
        .login-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #1a237e, #0d47a1, #2196f3, #0d47a1, #1a237e); }
        .login-card h2 { text-align: center; color: #1a237e; margin-bottom: 10px; font-size: 28px; font-weight: 600; }
        .login-card .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .login-card input { width: 100%; padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; margin-bottom: 18px; transition: all 0.3s ease; font-family: 'Poppins', sans-serif; }
        .login-card input:focus { outline: none; border-color: #1a237e; box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.1); }
        .login-card button { width: 100%; padding: 14px; background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; font-family: 'Poppins', sans-serif; }
        .login-card button:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(26, 35, 126, 0.4); }
        .login-card p { text-align: center; margin-top: 20px; color: #546e7a; }
        .login-card a { color: #1a237e; font-weight: 600; text-decoration: none; }
        .login-card a:hover { text-decoration: underline; }
        .alert { padding: 16px 22px; border-radius: 12px; margin-bottom: 22px; display: flex; align-items: center; gap: 12px; }
        .alert-error { background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%); color: #721c24; border-left: 4px solid #dc3545; }
        .alert-success { background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%); color: #155724; border-left: 4px solid #28a745; }
        .back-link { text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
        .back-link a { color: #666; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <h2><i class="fas fa-user-shield" style="color: #1a237e;"></i> Admin Login</h2>
        <p class="subtitle">Hospital Staff & Admin Portal</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">
                  <i class="fas fa-exclamation-circle"></i>
                  {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="post" id="loginForm">
            <input name="email" placeholder="Admin Email Address" required value="{{ request.form.get('email', '') }}">
            <input name="password" type="password" placeholder="Password" required>
            <button type="submit"><i class="fas fa-sign-in-alt"></i> Login</button>
        </form>

        <p>
            <a href="/admin/register"><i class="fas fa-user-plus"></i> Register New Admin</a>
        </p>
        
        <div class="back-link">
            <a href="/login"><i class="fas fa-arrow-left"></i> Back to Patient Portal</a>
        </div>
    </div>
</div>

</body>
</html>
